<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YoloAim 控制台</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<aside class="sidebar">
  <div class="logo">YoloAim</div>
  <nav>
    <button class="nav-item active" data-page="status">状态</button>
    <button class="nav-item" data-page="config">配置</button>
    <button class="nav-item" data-page="preview">预览</button>
  </nav>
  <div class="sidebar-foot">v0.1 · local</div>
</aside>

<main class="content">
  <section id="page-status" class="page active">
    <h2>状态</h2>
    <div class="pipeline-bar" id="pipeline-bar">
      <span class="pipe-label">链路</span>
      <span class="pipe-step" id="p-grab">截图 -</span>
      <span class="pipe-arrow">→</span>
      <span class="pipe-step" id="p-infer">推理 -</span>
      <span class="pipe-arrow">→</span>
      <span class="pipe-step" id="p-track">跟踪 -</span>
      <span class="pipe-arrow">→</span>
      <span class="pipe-step" id="p-aim">瞄准 -</span>
      <span class="pipe-arrow">→</span>
      <span class="pipe-step" id="p-total">总计 -</span>
    </div>
    <div class="cards">
      <div class="card"><div class="card-label">引擎</div><div id="st-running" class="card-value">-</div></div>
      <div class="card"><div class="card-label">FPS</div><div id="st-fps" class="card-value">-</div></div>
      <div class="card"><div class="card-label">检测数</div><div id="st-dets" class="card-value">-</div></div>
      <div class="card"><div class="card-label">推理延迟</div><div id="st-infer" class="card-value">-</div></div>
      <div class="card"><div class="card-label">瞄准槽</div><div id="st-slot" class="card-value">-</div></div>
      <div class="card"><div class="card-label">控制器</div><div id="st-ctrl" class="card-value">-</div></div>
    </div>
    <div class="controls">
      <button id="btn-start" class="btn">启动</button>
      <button id="btn-stop" class="btn danger">停止</button>
      <button id="btn-reload-model" class="btn">重载模型</button>
      <button id="btn-reload-cap" class="btn">重载截图</button>
      <button id="btn-test-ctrl" class="btn">测试控制器</button>
    </div>
    <div id="status-msg" class="msg"></div>
    <h3>最近检测</h3>
    <table id="dets-table">
      <thead><tr><th>ID</th><th>类别</th><th>置信度</th><th>x</th><th>y</th><th>w</th><th>h</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="page-config" class="page">
    <div class="pipeline-bar" id="pipeline-bar-cfg">
      <span class="pipe-label">链路</span>
      <span class="pipe-step" id="pg-grab">截图 -</span>
      <span class="pipe-arrow">→</span>
      <span class="pipe-step" id="pg-infer">推理 -</span>
      <span class="pipe-arrow">→</span>
      <span class="pipe-step" id="pg-track">跟踪 -</span>
      <span class="pipe-arrow">→</span>
      <span class="pipe-step" id="pg-aim">瞄准 -</span>
      <span class="pipe-arrow">→</span>
      <span class="pipe-step" id="pg-total">总计 -</span>
    </div>
    <div class="page-head">
      <h2>配置</h2>
      <div class="page-actions">
        <button id="btn-import-obs" class="btn">导入 OBS 场景…</button>
        <input type="file" id="file-import-obs" accept=".json" hidden>
        <button id="btn-save" class="btn primary">保存并应用</button>
        <button id="btn-reload" class="btn">重新载入</button>
      </div>
    </div>
    <div id="config-root"></div>
  </section>

  <section id="page-preview" class="page">
    <h2>预览</h2>
    <p class="hint">点击图像取准星颜色 → 自动写入 crosshair_manual 并启用</p>
    <div id="pick-bar">
      <span id="pick-swatch"></span>
      <span id="pick-rgb">-</span>
      <button id="btn-pick-apply" class="btn" disabled>应用到准星</button>
    </div>
    <img id="preview-img" alt="预览">
  </section>
</main>

<script src="js/labels.js"></script>
<script src="js/config_meta.js"></script>
<script src="js/app.js"></script>
</body>
</html>
